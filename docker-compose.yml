services:

  # db tier
  db:
    image: postgres:16-alpine             
    container_name: taskbox-db
    restart: unless-stopped                 
    environment:                           
      POSTGRES_USER: ${POSTGRES_USER}       
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data    
    networks:
      - taskbox-net
    healthcheck:                            
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # application tier
  api:
    build: ./backend                        
    container_name: taskbox-api
    restart: unless-stopped
    env_file: .env                          
    expose:
      - "3000"                             
    depends_on:
      db:
        condition: service_healthy         
    mem_limit: 256m                         
    cpus: 0.5                               
    networks:
      - taskbox-net

  # presentation TIER
  web:
    build: ./frontend                       
    container_name: taskbox-web
    restart: unless-stopped
    ports:
      - "8080:80"                          
    depends_on:
      api:
        condition: service_healthy        
    networks:
      - taskbox-net

networks:
  taskbox-net:
    name: taskbox-net
    driver: bridge

volumes:
  pgdata:
    name: taskbox-pgdata

# Job 1: serve the built React files  
# Job 2: reverse-proxy /api to the api container

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # compress text responses 
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # reverse proxy: Nginx forwards to api service.
    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://api:3000; # browser talks Nginx on port 8080, Nginx talks Express internally on port 3000.
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s; 
    }

    # build assets cache
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for share link
    location / {
        try_files $uri $uri/ /index.html;
    }
}
